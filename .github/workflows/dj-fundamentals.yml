      - "src/djai/renderer.py"
      - "src/djai/loudness.py"
      - "src/djai/execution.py"
      - "src/djai/set_renderer.py"
      - "src/djai/measurement.py"
      - "src/djai/models.py"
      - "tests/test_gain_staging.py"
      - "tests/test_measurement_quality.py"
      - "src/djai/judge/musical.py"
      - "src/djai/judge/professional.py"
      - "src/djai/candidate_renderer.py"
      - "src/djai/performance/mix_contract.py"
      - "src/djai/brain/style_policy.py"
      - "src/djai/brain/technique_policy.py"
      - "src/djai/training/teacher_dataset.py"
      - "src/djai/training/teacher_consensus.py"
      - "src/djai/training/teacher_governance.py"
      - "src/djai/training/teacher_quality.py"
      - "src/djai/training/human_preference.py"
      - "tests/test_human_preference_program.py"
      - "frontend/components/TrainingLab.tsx"
      - "frontend/lib/api.ts"
      - "frontend/lib/types.ts"
      - "tests/test_teacher_data_quality.py"
      - "tests/test_teacher_data_platform.py"
      - "tests/test_style_policy.py"
      - "tests/test_musical_quality_gate.py"
      - "tests/test_beat_integrity.py"
      - "tests/test_dj_fundamentals_milestone.py"
      - "tests/test_set_pipeline.py"
      - "tests/test_decision_planner.py"
      - "tests/test_dj_deck_performance_1_2.py"
      - ".github/workflows/dj-fundamentals.yml"
  push:
    branches:
      - main
      - dj-fundamentals
      - beat-integrity
      - musical-quality-gate
      - gain-staging
      - style-aware-dj-brain
      - teacher-data-platform
      - teacher-data-quality
      - human-preference-program
    paths:
      - "src/djai/analysis.py"
      - "src/djai/fallback.py"
      - "src/djai/decision.py"
      - "src/djai/set_planner.py"
      - "src/djai/performance/deck.py"
      - "src/djai/renderer.py"
      - "src/djai/loudness.py"
      - "src/djai/execution.py"
      - "src/djai/set_renderer.py"
      - "src/djai/measurement.py"
      - "src/djai/models.py"
      - "tests/test_gain_staging.py"
      - "tests/test_measurement_quality.py"
      - "src/djai/judge/musical.py"
      - "src/djai/judge/professional.py"
      - "src/djai/candidate_renderer.py"
      - "src/djai/performance/mix_contract.py"
      - "src/djai/brain/style_policy.py"
      - "src/djai/brain/technique_policy.py"
      - "src/djai/training/teacher_dataset.py"
      - "src/djai/training/teacher_consensus.py"
      - "src/djai/training/teacher_governance.py"
      - "src/djai/training/teacher_quality.py"
      - "src/djai/training/human_preference.py"
      - "tests/test_human_preference_program.py"
      - "frontend/components/TrainingLab.tsx"
      - "frontend/lib/api.ts"
      - "frontend/lib/types.ts"
      - "tests/test_teacher_data_quality.py"
      - "tests/test_teacher_data_platform.py"
      - "tests/test_style_policy.py"
      - "tests/test_musical_quality_gate.py"
      - "tests/test_beat_integrity.py"
      - "tests/test_dj_fundamentals_milestone.py"
      - "tests/test_set_pipeline.py"
      - "tests/test_decision_planner.py"
      - "tests/test_dj_deck_performance_1_2.py"
      - ".github/workflows/dj-fundamentals.yml"
  workflow_dispatch:

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run DJ fundamentals regression suite
        run: >
          python -m pytest
          tests/test_dj_fundamentals_milestone.py
          tests/test_beat_integrity.py
          tests/test_musical_quality_gate.py
          tests/test_gain_staging.py
          tests/test_style_policy.py
          tests/test_teacher_data_platform.py
          tests/test_teacher_data_quality.py
          tests/test_human_preference_program.py
          tests/test_measurement_quality.py
          tests/test_set_pipeline.py
          tests/test_decision_planner.py
          tests/test_dj_deck_performance_1_2.py::test_variable_deck_tempo_ride_preserves_pitch
          tests/test_dj_deck_performance_1_2.py::test_transition_plan_matches_then_returns_incoming_deck_to_native_bpm
          tests/test_dj_deck_performance_1_2.py::test_tempo_release_audio_reaches_native_rate_without_changing_output_length
          tests/test_dj_deck_performance_1_2.py::test_full_set_uses_native_post_handoff_state_for_next_transition
          tests/test_dj_deck_performance_1_2.py::test_real_pair_render_executes_tempo_release_segment
          tests/test_dj_deck_performance_1_2.py::test_live_manifest_exposes_deck_handoff_and_tempo_release

      - name: Typecheck Training Lab frontend
        working-directory: frontend
        run: npm run typecheck
