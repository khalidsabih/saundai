name: M1 neural governance and cache safety

on:
  pull_request:
    paths:
      - "src/djai/analysis.py"
      - "src/djai/cache.py"
      - "src/djai/models.py"
      - "src/djai/intelligence/neural_ears.py"
      - "src/djai/intelligence/neural_bar_phase.py"
      - "src/djai/intelligence/beat_preview.py"
      - "tests/test_m1_*"
      - ".github/workflows/m1-neural-safety.yml"
  push:
    branches: [main]
    paths:
      - "src/djai/analysis.py"
      - "src/djai/cache.py"
      - "src/djai/models.py"
      - "src/djai/intelligence/neural_ears.py"
      - "src/djai/intelligence/neural_bar_phase.py"
      - "src/djai/intelligence/beat_preview.py"
      - "tests/test_m1_*"
      - ".github/workflows/m1-neural-safety.yml"
  workflow_dispatch:

jobs:
  neural-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned core and test requirements
        run: |
          python -m pip install -c constraints.txt -e ".[dev]"
      - name: Test neural preview, governance, bar-phase, rollback and caches
        run: |
          python -m pytest -q \
            tests/test_m1_governance_cache_hardening.py \
            tests/test_m1_neural_bar_phase_trial.py \
            tests/test_m1_beat_only_preview.py \
            tests/test_m1_neural_bar_safety_promotion.py \
            tests/test_m1_beat_this_fast_track_rollback.py \
            tests/test_m1_neural_downbeat_integrity.py
