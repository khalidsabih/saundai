name: Planner and live reliability

on:
  pull_request:
  push:
    branches:
      - main
      - phase-13-15-time-live-venue-hardening
  workflow_dispatch:

jobs:
  planner-live-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Run focused complete-move, timing, venue and benchmark contracts
        run: |
          python -m pytest -q \
            tests/test_complete_djmove_generator_1_7.py \
            tests/test_phases_13_15_reliability.py \
            tests/test_dj_executive_v5_prepared_recovery.py \
            tests/test_full_set_benchmark_1_0.py \
            tests/test_milestone1_four_track.py \
            tests/test_ai_knowledge_audit.py \
            tests/test_world_model_utilization_audit.py \
            tests/test_decision_trace.py \
            tests/test_rejected_beat_grid_diagnostics.py \
            tests/test_phase_drift_decomposition.py \
            tests/test_independent_overlap_audio_tempo.py \
            tests/test_tempo_consistency.py \
            tests/test_cue_onset_precision_audit.py \
            tests/test_beat_sequence_counterfactual.py \
            tests/test_beat_sequence_interpretation.py \
            tests/test_continuous_beat_phase.py \
            tests/test_crossdeck_phase_counterfactual.py \
            tests/test_beat_grid_outlier_localization.py \
            tests/test_piecewise_beat_continuity.py \
            tests/test_extended_rhythmic_context.py \
            tests/test_independent_beat_downbeat_audit.py \
            tests/test_local_beat_disagreements.py \
            tests/test_beat_integrity_dataset_benchmark.py \
            tests/test_prepare_ballroom_beat_benchmark.py \
            tests/test_beat_error_decomposition.py \
            tests/test_beat_timing_root_cause.py \
            tests/test_synthetic_beat_timing_calibration.py \
            tests/test_synthetic_onset_frontend_comparison.py \
            tests/test_shadow_hop256_validation.py \
            tests/test_meter_downbeat_evidence.py \
            tests/test_phase_lock_trace_summary.py
