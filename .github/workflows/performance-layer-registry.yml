name: Performance layer registry correctness

on:
  pull_request:
    paths:
      - "src/djai/layers.py"
      - "tests/test_performance_layers.py"
      - ".github/workflows/performance-layer-registry.yml"
  push:
    branches: [main]
    paths:
      - "src/djai/layers.py"
      - "tests/test_performance_layers.py"
      - ".github/workflows/performance-layer-registry.yml"
  workflow_dispatch:

jobs:
  performance-layer-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project with test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -c constraints.txt -e ".[dev]"

      - name: Verify performance layer discovery and registry
        run: python -m pytest -q tests/test_performance_layers.py
