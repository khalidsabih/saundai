name: saund-ai

x-engine-environment: &engine-environment
  HOME: /tmp
  TORCH_HOME: /model-cache/torch
  HF_HOME: /model-cache/huggingface
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /workspace/src
  DJAI_WORKSPACE: /workspace
  DJAI_ANALYSIS_WORKERS: ${DJAI_ANALYSIS_WORKERS:-0}
  DJAI_GRAPH_WORKERS: ${DJAI_GRAPH_WORKERS:-0}
  DJAI_PROCESS_START_METHOD: ${DJAI_PROCESS_START_METHOD:-auto}
  DJAI_CPU_BUDGET: ${DJAI_CPU_BUDGET:-0}
  DJAI_JOB_HEARTBEAT_SECONDS: ${DJAI_JOB_HEARTBEAT_SECONDS:-5}
  DJAI_JOB_STALL_SECONDS: ${DJAI_JOB_STALL_SECONDS:-180}
  DJAI_MEASUREMENT_ENABLED: ${DJAI_MEASUREMENT_ENABLED:-1}
  DJAI_MEASUREMENT_TOP_K: ${DJAI_MEASUREMENT_TOP_K:-4}
  DJAI_MEASUREMENT_SAMPLE_RATE: ${DJAI_MEASUREMENT_SAMPLE_RATE:-44100}
  DJAI_MEASUREMENT_PRE_ROLL: ${DJAI_MEASUREMENT_PRE_ROLL:-2}
  DJAI_MEASUREMENT_POST_ROLL: ${DJAI_MEASUREMENT_POST_ROLL:-2}
  DJAI_MEASUREMENT_ANALYTICAL_WEIGHT: ${DJAI_MEASUREMENT_ANALYTICAL_WEIGHT:-0.55}
  DJAI_MEASUREMENT_AUDIO_WEIGHT: ${DJAI_MEASUREMENT_AUDIO_WEIGHT:-0.45}
  DJAI_MEASUREMENT_MINIMUM: ${DJAI_MEASUREMENT_MINIMUM:-0.42}
  DJAI_MEASUREMENT_LOG: ${DJAI_MEASUREMENT_LOG:-ratings/automatic-measurements.jsonl}
  # Optional Beat Integrity diagnostics; forward host setting into the engine.
  DJAI_PHASE_LOCK_TRACE_PATH: ${DJAI_PHASE_LOCK_TRACE_PATH:-}
  DJAI_AUTO_TOP_K: ${DJAI_AUTO_TOP_K:-4}
  DJAI_AUTO_EXPANDED_TOP_K: ${DJAI_AUTO_EXPANDED_TOP_K:-8}
  DJAI_AUTO_MEASUREMENT_MINIMUM: ${DJAI_AUTO_MEASUREMENT_MINIMUM:-0.42}
  DJAI_AUTO_RELAXED_MINIMUM: ${DJAI_AUTO_RELAXED_MINIMUM:-0.28}
  DJAI_AUTO_EMERGENCY_SECONDS: ${DJAI_AUTO_EMERGENCY_SECONDS:-1.8}
  DJAI_AUTO_STEMS: ${DJAI_AUTO_STEMS:-background}
  DJAI_STEM_MODEL: ${DJAI_STEM_MODEL:-htdemucs}
  DJAI_STEM_DEVICE: ${DJAI_STEM_DEVICE:-cpu}
  DJAI_LIVE_BITRATE: ${DJAI_LIVE_BITRATE:-192k}
  DJAI_AUTO_REFIT: ${DJAI_AUTO_REFIT:-1}
  DJAI_AUTO_REFIT_INTERVAL: ${DJAI_AUTO_REFIT_INTERVAL:-20}
  DJAI_PROFESSIONAL_BRAIN: ${DJAI_PROFESSIONAL_BRAIN:-1}
  DJAI_BRAIN_ANALYTICAL_POOL: ${DJAI_BRAIN_ANALYTICAL_POOL:-48}
  DJAI_BRAIN_FINALISTS: ${DJAI_BRAIN_FINALISTS:-8}
  DJAI_BRAIN_RETRY_ROUNDS: ${DJAI_BRAIN_RETRY_ROUNDS:-2}
  DJAI_BRAIN_DIVERSITY_WEIGHT: ${DJAI_BRAIN_DIVERSITY_WEIGHT:-0.34}
  DJAI_BRAIN_MINIMUM_SCORE: ${DJAI_BRAIN_MINIMUM_SCORE:-0.56}
  DJAI_UNIFIED_MINIMUM_SCORE: ${DJAI_UNIFIED_MINIMUM_SCORE:-0.56}
  DJAI_BRAIN_REHEARSAL_MINIMUM: ${DJAI_BRAIN_REHEARSAL_MINIMUM:-0.34}
  DJAI_ADAPTIVE_REHEARSAL: ${DJAI_ADAPTIVE_REHEARSAL:-1}
  DJAI_ADAPTIVE_REHEARSAL_PILOT: ${DJAI_ADAPTIVE_REHEARSAL_PILOT:-2}
  DJAI_ADAPTIVE_REHEARSAL_MIN_SCORE: ${DJAI_ADAPTIVE_REHEARSAL_MIN_SCORE:-0.66}
  DJAI_ADAPTIVE_REHEARSAL_MAX_UNCERTAINTY: ${DJAI_ADAPTIVE_REHEARSAL_MAX_UNCERTAINTY:-0.22}
  DJAI_CAPTURE_RENDER_EMBEDDINGS: ${DJAI_CAPTURE_RENDER_EMBEDDINGS:-auto}
  DJAI_TARGET_SOURCE_PLAY_SECONDS: ${DJAI_TARGET_SOURCE_PLAY_SECONDS:-150}
  DJAI_SOFT_MAX_SOURCE_PLAY_SECONDS: ${DJAI_SOFT_MAX_SOURCE_PLAY_SECONDS:-210}
  DJAI_REJECTION_MEMORY: ${DJAI_REJECTION_MEMORY:-ratings/rejected-transitions.jsonl}
  DJAI_RENDER_EMBEDDING_BACKEND: ${DJAI_RENDER_EMBEDDING_BACKEND:-statistical}
  DJAI_MODEL_REGISTRY: ${DJAI_MODEL_REGISTRY:-config/model-registry.json}
  DJAI_MODEL_ALLOW_DOWNLOAD: ${DJAI_MODEL_ALLOW_DOWNLOAD:-0}
  DJAI_NEURAL_BEATS: ${DJAI_NEURAL_BEATS:-auto}
  DJAI_BEAT_THIS_MODEL: ${DJAI_BEAT_THIS_MODEL:-small0}
  DJAI_BEAT_THIS_DEVICE: ${DJAI_BEAT_THIS_DEVICE:-auto}
  DJAI_NEURAL_BEAT_USE_THRESHOLD: ${DJAI_NEURAL_BEAT_USE_THRESHOLD:-0.70}
  DJAI_SET_LOOKAHEAD_DEPTH: ${DJAI_SET_LOOKAHEAD_DEPTH:-3}
  DJAI_SET_LOOKAHEAD_BEAM: ${DJAI_SET_LOOKAHEAD_BEAM:-5}
  DJAI_SET_FUTURE_DISCOUNT: ${DJAI_SET_FUTURE_DISCOUNT:-0.78}
  DJAI_SET_CONTEXT_WEIGHT: ${DJAI_SET_CONTEXT_WEIGHT:-0.32}
  # 2.0 RC: pass the complete-move authority/runtime knobs through Compose.
  # Prior releases documented these in .env but did not actually inject them
  # into the engine container, so host configuration could silently differ
  # from the running planner.
  DJAI_PLANNER_MODE: ${DJAI_PLANNER_MODE:-move_authoritative}
  DJAI_LAZY_CANDIDATE_WIDTH: ${DJAI_LAZY_CANDIDATE_WIDTH:-10}
  DJAI_LAZY_EXPANSION_WIDTH: ${DJAI_LAZY_EXPANSION_WIDTH:-10}
  DJAI_LAZY_OPENER_CANDIDATES: ${DJAI_LAZY_OPENER_CANDIDATES:-5}
  DJAI_MOVE_LOOKAHEAD: ${DJAI_MOVE_LOOKAHEAD:-3}
  DJAI_MOVE_SEARCH_BRANCH_WIDTH: ${DJAI_MOVE_SEARCH_BRANCH_WIDTH:-3}
  DJAI_MOVE_LOOKAHEAD_DISCOUNT: ${DJAI_MOVE_LOOKAHEAD_DISCOUNT:-0.72}
  DJAI_HEADPHONES: ${DJAI_HEADPHONES:-1}
  DJAI_HEADPHONES_SERIOUS_POOL: ${DJAI_HEADPHONES_SERIOUS_POOL:-12}
  DJAI_HEADPHONES_MIN_RENDERS: ${DJAI_HEADPHONES_MIN_RENDERS:-2}
  DJAI_HEADPHONES_MAX_RENDERS: ${DJAI_HEADPHONES_MAX_RENDERS:-4}
  DJAI_HEADPHONES_SAMPLE_RATE: ${DJAI_HEADPHONES_SAMPLE_RATE:-22050}
  DJAI_STRUCTURAL_DECK_OPS: ${DJAI_STRUCTURAL_DECK_OPS:-1}
  DJAI_STRUCTURAL_LOOP_OUTGOING: ${DJAI_STRUCTURAL_LOOP_OUTGOING:-0}
  DJAI_STRUCTURAL_EXTEND_INTRO: ${DJAI_STRUCTURAL_EXTEND_INTRO:-0}
  DJAI_STRUCTURAL_HOLD_STEM: ${DJAI_STRUCTURAL_HOLD_STEM:-0}
  DJAI_STRUCTURAL_JUMPS: ${DJAI_STRUCTURAL_JUMPS:-0}
  DJAI_STRUCTURAL_MIN_LOOP_WAIT_BARS: ${DJAI_STRUCTURAL_MIN_LOOP_WAIT_BARS:-20}
  DJAI_CRATE_MEMORY: ${DJAI_CRATE_MEMORY:-1}
  DJAI_CRATE_MEMORY_PATH: ${DJAI_CRATE_MEMORY_PATH:-ratings/crate-memory.sqlite3}
  DJAI_CRATE_MEMORY_MAX_ADJUSTMENT: ${DJAI_CRATE_MEMORY_MAX_ADJUSTMENT:-0.065}
  DJAI_TRAINING_LAB_ENABLED: ${DJAI_TRAINING_LAB_ENABLED:-1}
  SAUND_TRAINING_SOURCE_RIGHTS_CONFIRMED: ${SAUND_TRAINING_SOURCE_RIGHTS_CONFIRMED:-0}
  SAUND_IMAGE_TAG: ${SAUND_IMAGE_TAG:-local}
  SAUND_BUILD_COMMIT: ${SAUND_BUILD_COMMIT:-}
  SAUND_BUILD_TIME_UTC: ${SAUND_BUILD_TIME_UTC:-}

services:
  djai:
    image: saund-ai-engine:${SAUND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DJAI_ENGINE_DOCKER_TARGET:-brain}
      args:
        SAUND_BUILD_COMMIT: ${SAUND_BUILD_COMMIT:-}
        SAUND_BUILD_TIME_UTC: ${SAUND_BUILD_TIME_UTC:-}
        SAUND_IMAGE_TAG: ${SAUND_IMAGE_TAG:-local}
    working_dir: /workspace
    environment: *engine-environment
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: djai-model-cache
        target: /model-cache
    entrypoint: ["python", "-m", "djai"]

  api:
    image: saund-ai-engine:${SAUND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DJAI_API_DOCKER_TARGET:-brain}
      args:
        SAUND_BUILD_COMMIT: ${SAUND_BUILD_COMMIT:-}
        SAUND_BUILD_TIME_UTC: ${SAUND_BUILD_TIME_UTC:-}
        SAUND_IMAGE_TAG: ${SAUND_IMAGE_TAG:-local}
    working_dir: /workspace
    environment:
      <<: *engine-environment
      DJAI_CORS_ORIGINS: ${DJAI_CORS_ORIGINS:-http://localhost:3000}
      DJAI_CONFIRMATION_SECRET: ${DJAI_CONFIRMATION_SECRET:-local-development-secret-change-me}
      DJAI_JOB_WORKERS: ${DJAI_JOB_WORKERS:-2}
      DJAI_STEM_JOB_WORKERS: ${DJAI_STEM_JOB_WORKERS:-1}
      DJAI_MAX_UPLOAD_BYTES: ${DJAI_MAX_UPLOAD_BYTES:-536870912}
      SAUND_ACCOUNT_DB: ${SAUND_ACCOUNT_DB:-accounts/accounts.sqlite3}
      SAUND_AUTH_COOKIE_NAME: ${SAUND_AUTH_COOKIE_NAME:-saund_session}
      SAUND_AUTH_SESSION_DAYS: ${SAUND_AUTH_SESSION_DAYS:-14}
      SAUND_AUTH_COOKIE_SECURE: ${SAUND_AUTH_COOKIE_SECURE:-0}
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: djai-model-cache
        target: /model-cache
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${DJAI_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12

  frontend:
    image: saund-ai-frontend:${SAUND_IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        SAUND_INTERNAL_API_URL: ${SAUND_INTERNAL_API_URL:-http://api:8000}
        SAUND_BUILD_COMMIT: ${SAUND_BUILD_COMMIT:-}
        SAUND_BUILD_TIME_UTC: ${SAUND_BUILD_TIME_UTC:-}
    environment:
      SAUND_INTERNAL_API_URL: ${SAUND_INTERNAL_API_URL:-http://api:8000}
    ports:
      - "${DJAI_FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  test:
    image: saund-ai-engine-test:${SAUND_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      target: test
      args:
        SAUND_BUILD_COMMIT: ${SAUND_BUILD_COMMIT:-}
        SAUND_BUILD_TIME_UTC: ${SAUND_BUILD_TIME_UTC:-}
        SAUND_IMAGE_TAG: ${SAUND_IMAGE_TAG:-local}
    working_dir: /workspace
    environment:
      <<: *engine-environment
      DJAI_AUTO_STEMS: "off"
      DJAI_CONFIRMATION_SECRET: test-secret
      # Keep regression tests fast; production/API services keep the 48 -> 8 default.
      DJAI_BRAIN_ANALYTICAL_POOL: "24"
      DJAI_BRAIN_FINALISTS: "4"
      DJAI_BRAIN_RETRY_ROUNDS: "1"
    volumes:
      - type: bind
        source: .
        target: /workspace
    entrypoint: ["python", "-m", "pytest"]
    command: ["-q"]

volumes:
  djai-model-cache:
