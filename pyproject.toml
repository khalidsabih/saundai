[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "djai-engine"
version = "2.0.0-rc.1"
description = "SAUND.AI local-first autonomous music performance engine with rendered-audio validation and deterministic execution"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "SAUND.AI Project"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "librosa>=0.10.2,<0.12",
  "soundfile>=0.12,<0.14",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "argon2-cffi>=25.1,<26",
  "email-validator>=2.3,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "build>=1.2,<2",
]
live = ["sounddevice>=0.5,<1"]
stems = ["demucs>=4,<5"]
embeddings = ["torch>=2.2,<3", "torchaudio>=2.2,<3", "transformers>=4.38,<5"]
neural = ["torch>=2.2,<3", "torchaudio>=2.2,<3", "transformers>=4.38,<5", "beat-this==1.1.0"]
hosted = ["boto3>=1.35,<2", "psycopg[binary]>=3.2,<4"]
# Research/reference CUE-DETR runtime. These versions mirror the public
# ETH-DISCO environment closely enough to avoid silent model drift. Use Python
# 3.11 or 3.12 for this extra; it is not required by the professional brain.
cue = [
  "numpy==1.26.4",
  "scipy==1.14.0",
  "librosa==0.10.2.post1",
  "torch==2.3.1",
  "torchvision==0.18.1",
  "transformers==4.42.3",
  "pillow==10.4.0",
  "timm==1.0.7",
  "matplotlib==3.9.1",
  "safetensors>=0.4,<1",
]
all = [
  "pytest>=8,<10",
  "httpx>=0.27,<1",
  "build>=1.2,<2",
  "sounddevice>=0.5,<1",
  "demucs>=4,<5",
  "torch>=2.2,<3",
  "torchaudio>=2.2,<3",
  "transformers>=4.38,<5",
  "beat-this==1.1.0",
]

[project.scripts]
djai = "djai.cli:main"
saund = "djai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["djai"]
branch = true
